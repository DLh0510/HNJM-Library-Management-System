name: 打包 EXE (Nuitka)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install ttkbootstrap pillow nuitka ordered-set zstandard

      - name: Nuitka 编译
        run: >
          python -m nuitka
          --onefile
          --windows-console-mode=disable
          --windows-icon-from-ico=logo.ico
          --include-data-file=logo.png=logo.png
          --include-data-file=logo.ico=logo.ico
          --enable-plugin=tk-inter
          --assume-yes-for-downloads
          --output-filename=图书出入库管理系统.exe
          app.py

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 图书出入库管理系统.exe
