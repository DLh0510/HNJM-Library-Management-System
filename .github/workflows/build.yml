name: 打包 EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install ttkbootstrap pillow pyinstaller flask cryptography qrcode pypng requests openpyxl

      - name: 测试
        run: python -m unittest -v test_db.py

      - name: 打包
        run: >
          pyinstaller --onefile --windowed
          --name 图书出入库管理系统
          --icon=logo.ico
          --add-data "logo.png;."
          --add-data "logo.ico;."
          --collect-all ttkbootstrap
          --collect-all openpyxl
          --hidden-import flask
          --hidden-import cryptography
          --hidden-import requests
          --hidden-import PIL
          --hidden-import qrcode
          app.py

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/图书出入库管理系统.exe
