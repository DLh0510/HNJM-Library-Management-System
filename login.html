<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书出入管理系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        /* 动态背景动画 */
        .gradient-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 玻璃拟态效果 */
        .glass {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .glass-dark {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        /* 浮动动画 */
        .float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        /* 输入框聚焦效果 */
        .input-group:focus-within label {
            transform: translateY(-24px) scale(0.85);
            color: #3b82f6;
        }
        
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.85);
        }
        
        /* 加载动画 */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 书本翻页效果 */
        .book-icon {
            transform-style: preserve-3d;
            animation: bookFloat 3s ease-in-out infinite;
        }
        
        @keyframes bookFloat {
            0%, 100% { transform: rotateY(0deg) rotateX(5deg); }
            50% { transform: rotateY(10deg) rotateX(-5deg); }
        }
        
        /* 粒子背景 */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: particle-float 20s infinite;
        }
        
        @keyframes particle-float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <!-- 动态粒子背景 -->
    <div id="particles" class="absolute inset-0 pointer-events-none"></div>

    <!-- 主容器 -->
    <div class="relative z-10 w-full max-w-5xl flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-16">
        
        <!-- 左侧：品牌展示区域 -->
        <div class="flex-1 text-center lg:text-left text-white space-y-6 float">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl glass mb-4 book-icon">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            
            <h1 class="text-5xl lg:text-6xl font-bold tracking-tight leading-tight">
                图书出入<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-pink-200">管理系统</span>
            </h1>
            
            <p class="text-lg text-white/90 max-w-md mx-auto lg:mx-0 leading-relaxed">
                智能化图书借阅管理，让知识流动更高效。<br>
                安全、便捷、实时的图书追踪与管理平台。
            </p>
            
            <div class="flex flex-wrap gap-4 justify-center lg:justify-start pt-4">
                <div class="flex items-center gap-2 px-4 py-2 rounded-full glass text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>实时追踪</span>
                </div>
                <div class="flex items-center gap-2 px-4 py-2 rounded-full glass text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    <span>安全可靠</span>
                </div>
                <div class="flex items-center gap-2 px-4 py-2 rounded-full glass text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span>高效便捷</span>
                </div>
            </div>
        </div>

        <!-- 右侧：登录表单 -->
        <div class="w-full max-w-md">
            <div class="glass p-8 lg:p-10 rounded-3xl shadow-2xl">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">欢迎回来</h2>
                    <p class="text-gray-600 text-sm">请登录您的账户以继续</p>
                </div>

                <form id="loginForm" class="space-y-6" onsubmit="handleLogin(event)">
                    <!-- 用户名输入 -->
                    <div class="input-group relative">
                        <input type="text" id="username" required placeholder=" " 
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white/50 focus:border-blue-500 focus:bg-white focus:outline-none transition-all duration-300 peer text-gray-800">
                        <label for="username" 
                            class="absolute left-4 top-3 text-gray-500 transition-all duration-300 pointer-events-none origin-left">
                            用户名 / 工号
                        </label>
                        <div class="absolute right-4 top-3.5 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- 密码输入 -->
                    <div class="input-group relative">
                        <input type="password" id="password" required placeholder=" " 
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white/50 focus:border-blue-500 focus:bg-white focus:outline-none transition-all duration-300 pr-12 text-gray-800">
                        <label for="password" 
                            class="absolute left-4 top-3 text-gray-500 transition-all duration-300 pointer-events-none origin-left">
                            密码
                        </label>
                        <button type="button" onclick="togglePassword()" class="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600 transition-colors">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- 记住我和忘记密码 -->
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 transition-all">
                            <span class="text-gray-600 group-hover:text-gray-800 transition-colors">记住我</span>
                        </label>
                        <a href="#" class="text-blue-600 hover:text-blue-800 font-medium transition-colors hover:underline">
                            忘记密码？
                        </a>
                    </div>

                    <!-- 登录按钮 -->
                    <button type="submit" id="loginBtn" 
                        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transform transition-all duration-200 hover:scale-[1.02] hover:shadow-xl active:scale-[0.98] flex items-center justify-center gap-2 group">
                        <span id="btnText">登 录</span>
                        <svg id="btnIcon" class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                        </svg>
                        <div id="btnLoader" class="loader hidden"></div>
                    </button>
                </form>

                <!-- 分隔线 -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white/50 text-gray-500 rounded">其他登录方式</span>
                    </div>
                </div>

                <!-- 社交登录 -->
                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-2 px-4 py-2.5 border-2 border-gray-200 rounded-xl hover:border-blue-400 hover:bg-blue-50 transition-all duration-200 group">
                        <svg class="w-5 h-5 text-gray-600 group-hover:text-blue-600" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                        </svg>
                        <span class="text-sm font-medium text-gray-700">企业微信</span>
                    </button>
                    <button class="flex items-center justify-center gap-2 px-4 py-2.5 border-2 border-gray-200 rounded-xl hover:border-red-400 hover:bg-red-50 transition-all duration-200 group">
                        <svg class="w-5 h-5 text-gray-600 group-hover:text-red-600" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <span class="text-sm font-medium text-gray-700">钉钉</span>
                    </button>
                </div>

                <!-- 注册链接 -->
                <p class="mt-8 text-center text-sm text-gray-600">
                    还没有账户？
                    <a href="#" class="font-semibold text-blue-600 hover:text-blue-800 transition-colors hover:underline">
                        立即注册
                    </a>
                </p>
            </div>
            
            <!-- 装饰性元素 -->
            <div class="absolute -z-10 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] bg-white/10 rounded-full blur-3xl"></div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="absolute bottom-4 text-center w-full text-white/60 text-sm">
        <p>&copy; 2026 图书出入管理系统 | 技术支持：图书馆信息技术部</p>
    </div>

    <script>
        // 生成背景粒子
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 20 + 20) + 's';
                container.appendChild(particle);
            }
        }
        
        createParticles();

        // 密码可见性切换
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            }
        }

        // 登录处理
        function handleLogin(event) {
            event.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            const username = document.getElementById('username').value;
            
            // 显示加载状态
            btn.disabled = true;
            btnText.textContent = '登录中...';
            btnIcon.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            btn.classList.add('cursor-not-allowed', 'opacity-80');
            
            // 模拟登录请求
            setTimeout(() => {
                // 恢复按钮状态
                btn.disabled = false;
                btnText.textContent = '登录成功';
                btnLoader.classList.add('hidden');
                btn.classList.remove('cursor-not-allowed', 'opacity-80');
                btn.classList.remove('from-blue-600', 'to-purple-600');
                btn.classList.add('from-green-500', 'to-emerald-600');
                
                // 显示成功提示（可选）
                setTimeout(() => {
                    alert(`欢迎回来，${username}！\n正在进入图书管理系统...`);
                    // 这里可以添加实际的页面跳转逻辑
                    // window.location.href = '/dashboard';
                    
                    // 重置按钮
                    setTimeout(() => {
                        btnText.textContent = '登 录';
                        btnIcon.classList.remove('hidden');
                        btn.classList.remove('from-green-500', 'to-emerald-600');
                        btn.classList.add('from-blue-600', 'to-purple-600');
                    }, 1000);
                }, 500);
            }, 2000);
        }

        // 输入框动画增强
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('transform', 'scale-[1.02]');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('transform', 'scale-[1.02]');
            });
        });
    </script>
</body>
</html>
